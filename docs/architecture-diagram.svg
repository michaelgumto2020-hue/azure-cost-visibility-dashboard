<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1b1b">
    Azure Cost Visibility Dashboard — Architecture
  </text>

  <!-- Subscription boundary -->
  <rect x="40" y="65" width="920" height="500" rx="10" fill="#f5f8fc" stroke="#9fb7d4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="90" font-size="13" fill="#4a6fa5" font-weight="600">Azure Subscription (subscription-scoped budget)</text>

  <!-- Budget -->
  <rect x="80" y="115" width="200" height="90" rx="8" fill="#e8f1ff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="180" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1b">Consumption Budget</text>
  <text x="180" y="165" text-anchor="middle" font-size="12" fill="#333">$50 / month</text>
  <text x="180" y="182" text-anchor="middle" font-size="12" fill="#333">Alert at 80% threshold</text>

  <!-- Action Group -->
  <rect x="400" y="115" width="200" height="90" rx="8" fill="#fff4e0" stroke="#c98a1f" stroke-width="1.5"/>
  <text x="500" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1b">Monitor Action Group</text>
  <text x="500" y="165" text-anchor="middle" font-size="12" fill="#333">Webhook receiver</text>
  <text x="500" y="182" text-anchor="middle" font-size="12" fill="#333">→ Logic App callback URL</text>

  <!-- Logic App -->
  <rect x="720" y="115" width="200" height="110" rx="8" fill="#eaf7ea" stroke="#3a8f3a" stroke-width="1.5"/>
  <text x="820" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1b">Logic App Workflow</text>
  <text x="820" y="162" text-anchor="middle" font-size="12" fill="#333">HTTP trigger (webhook)</text>
  <text x="820" y="179" text-anchor="middle" font-size="12" fill="#333">→ HTTP POST action</text>
  <text x="820" y="196" text-anchor="middle" font-size="12" fill="#333">to SendGrid Mail Send API</text>

  <!-- SendGrid -->
  <rect x="720" y="260" width="200" height="90" rx="8" fill="#f3e9ff" stroke="#7a4bb0" stroke-width="1.5"/>
  <text x="820" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1b">SendGrid API</text>
  <text x="820" y="310" text-anchor="middle" font-size="12" fill="#333">Single Sender Verified</text>
  <text x="820" y="327" text-anchor="middle" font-size="12" fill="#333">Sends real email</text>

  <!-- Inbox -->
  <rect x="720" y="400" width="200" height="70" rx="8" fill="#fdeeee" stroke="#b5403d" stroke-width="1.5"/>
  <text x="820" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1b">Recipient Inbox</text>
  <text x="820" y="450" text-anchor="middle" font-size="11" fill="#333">(delivered to Spam — see README)</text>

  <!-- Resource Group box -->
  <rect x="80" y="260" width="320" height="260" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <text x="240" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1b">Resource Group: cost-visibility-rg</text>

  <rect x="105" y="305" width="270" height="55" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="240" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1b1b">Logic App + Action Group</text>
  <text x="240" y="345" text-anchor="middle" font-size="11" fill="#555">(hosted here)</text>

  <rect x="105" y="375" width="270" height="80" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="240" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1b1b">Workbook: Cost Visibility Dashboard</text>
  <text x="240" y="416" text-anchor="middle" font-size="11" fill="#555">Resource Graph: count by type</text>
  <text x="240" y="432" text-anchor="middle" font-size="11" fill="#555">Resource Graph: count by resource group</text>
  <text x="240" y="448" text-anchor="middle" font-size="11" fill="#555">Text tile: budget governance summary</text>

  <rect x="105" y="465" width="270" height="40" rx="6" fill="#fff8e1" stroke="#c9a227"/>
  <text x="240" y="490" text-anchor="middle" font-size="11" fill="#7a5c00">Cost $ tiles pending — see "Open Item" in README</text>

  <!-- Arrows -->
  <line x1="280" y1="160" x2="398" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="#555">threshold crossed</text>

  <line x1="600" y1="160" x2="718" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="150" text-anchor="middle" font-size="11" fill="#555">invokes webhook</text>

  <line x1="820" y1="225" x2="820" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="350" x2="820" y2="398" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="240" y1="205" x2="240" y2="258" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="255" y="235" font-size="10" fill="#888">deployed into</text>

  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#777">
    IaC: Terraform (azurerm). Workbook content authored in Portal, exported as JSON, loaded via file().
  </text>
</svg>
